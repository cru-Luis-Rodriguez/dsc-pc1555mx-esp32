<svg viewBox="0 0 860 440" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Per-zone analog front end. ESP32 3.3 volt rail through R1 5.6 kilohm pull-up to a sense node. From the node: R3 1 kilohm in series to the ESP32 ADC pin with C1 0.1 microfarad from the ADC side to ground; R2 15 kilohm from the node to ground; and the zone loop with its 5.6 kilohm end-of-line resistor from the node to ground. Readings: short 0 volts tamper, 1.39 volts normal, 2.40 volts open or triggered.">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ink  { fill: #2b2f2e; }
    .dim  { fill: #6d7a76; }
  </style>
  <defs>
    <marker id="arrz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b2f2e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="440" rx="8" fill="#f7f6f3" stroke="#d8d5cd"/>
  <text x="24" y="34" class="sans ink" font-size="16" font-weight="700">DIY zone reader — one channel (repeat × 6)</text>

  <!-- 3.3V rail -->
  <circle cx="70" cy="90" r="5" fill="#c0392b"/>
  <text x="70" y="72" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#c0392b">ESP32 3.3 V</text>
  <path d="M75,90 H120" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- R1 -->
  <rect x="120" y="78" width="80" height="24" rx="3" fill="#fff" stroke="#2b2f2e" stroke-width="1.5"/>
  <text x="160" y="94" text-anchor="middle" class="mono ink" font-size="11">R1 · 5.6 kΩ</text>
  <text x="160" y="116" text-anchor="middle" class="mono dim" font-size="9">pull-up = EOL value</text>
  <path d="M200,90 H290" fill="none" stroke="#2b2f2e" stroke-width="2"/>

  <!-- sense node -->
  <circle cx="290" cy="90" r="4.5" fill="#2b2f2e"/>
  <text x="290" y="72" text-anchor="middle" class="mono" font-size="10" fill="#3b6ea5" font-weight="600">sense node</text>

  <!-- R3 to ADC -->
  <path d="M290,90 H330" fill="none" stroke="#2b2f2e" stroke-width="2"/>
  <rect x="330" y="78" width="72" height="24" rx="3" fill="#fff" stroke="#2b2f2e" stroke-width="1.5"/>
  <text x="366" y="94" text-anchor="middle" class="mono ink" font-size="11">R3 · 1 kΩ</text>
  <path d="M402,90 H470" fill="none" stroke="#2b2f2e" stroke-width="2"/>
  <circle cx="470" cy="90" r="4.5" fill="#2b2f2e"/>
  <path d="M470,90 H560" fill="none" stroke="#2b2f2e" stroke-width="2" marker-end="url(#arrz)"/>
  <text x="572" y="94" class="mono ink" font-size="12" font-weight="600">ESP32 ADC pin</text>
  <text x="572" y="110" class="mono dim" font-size="9.5">ADC1 only: GPIO 32 33 34 35 36 39</text>

  <!-- C1 -->
  <path d="M470,90 V150" fill="none" stroke="#2b2f2e" stroke-width="2"/>
  <path d="M452,150 H488" fill="none" stroke="#2b2f2e" stroke-width="2.5"/>
  <path d="M452,160 H488" fill="none" stroke="#2b2f2e" stroke-width="2.5"/>
  <text x="498" y="160" class="mono ink" font-size="10.5">C1 · 0.1 µF</text>
  <path d="M470,160 V300" fill="none" stroke="#2b2f2e" stroke-width="2"/>

  <!-- R2 -->
  <path d="M290,90 V140" fill="none" stroke="#2b2f2e" stroke-width="2"/>
  <rect x="266" y="140" width="48" height="60" rx="3" fill="#fff" stroke="#2b2f2e" stroke-width="1.5"/>
  <text x="290" y="166" text-anchor="middle" class="mono ink" font-size="10.5">R2</text>
  <text x="290" y="182" text-anchor="middle" class="mono ink" font-size="10.5">15 kΩ</text>
  <path d="M290,200 V300" fill="none" stroke="#2b2f2e" stroke-width="2"/>
  <text x="304" y="238" class="mono dim" font-size="9.5">caps the open-loop</text>
  <text x="304" y="250" class="mono dim" font-size="9.5">voltage at ~2.4 V,</text>
  <text x="304" y="262" class="mono dim" font-size="9.5">inside ADC linear range</text>

  <!-- zone loop branch -->
  <path d="M290,90 H240 V120 H150 V180" fill="none" stroke="#3b6ea5" stroke-width="2.5"/>
  <circle cx="240" cy="90" r="0.1"/>
  <text x="146" y="174" text-anchor="end" class="mono" font-size="10" fill="#3b6ea5">zone wire 1</text>
  <rect x="90" y="180" width="120" height="86" rx="6" fill="none" stroke="#3b6ea5" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="150" y="204" text-anchor="middle" class="sans" font-size="10.5" font-weight="600" fill="#3b6ea5">zone loop</text>
  <text x="150" y="220" text-anchor="middle" class="mono" font-size="9.5" fill="#3b6ea5">contacts (NC)</text>
  <text x="150" y="234" text-anchor="middle" class="mono" font-size="9.5" fill="#3b6ea5">+ 5.6 kΩ EOL</text>
  <text x="150" y="252" text-anchor="middle" class="mono dim" font-size="9">through the walls</text>
  <path d="M150,266 V300" fill="none" stroke="#3b6ea5" stroke-width="2.5"/>
  <text x="146" y="292" text-anchor="end" class="mono" font-size="10" fill="#3b6ea5">zone wire 2 (COM leg)</text>

  <!-- ground rail -->
  <path d="M150,300 H470" fill="none" stroke="#2b2f2e" stroke-width="2.5"/>
  <circle cx="290" cy="300" r="4.5" fill="#2b2f2e"/>
  <circle cx="470" cy="300" r="4.5" fill="#2b2f2e"/>
  <path d="M310,300 V318" fill="none" stroke="#2b2f2e" stroke-width="2"/>
  <path d="M292,318 H328 M298,325 H322 M304,332 H316" fill="none" stroke="#2b2f2e" stroke-width="2"/>
  <text x="340" y="330" class="mono dim" font-size="10">ESP32 GND</text>

  <!-- readings table -->
  <rect x="600" y="150" width="236" height="150" rx="6" fill="#eeece7" stroke="#d8d5cd"/>
  <text x="616" y="176" class="sans ink" font-size="12" font-weight="700">what the ADC reads</text>
  <text x="616" y="202" class="mono" font-size="11" fill="#c0392b" font-weight="600">~0.00 V</text>
  <text x="700" y="202" class="mono ink" font-size="11">short → tamper</text>
  <text x="616" y="228" class="mono" font-size="11" fill="#3e8e5a" font-weight="600">~1.39 V</text>
  <text x="700" y="228" class="mono ink" font-size="11">normal (closed)</text>
  <text x="616" y="254" class="mono" font-size="11" fill="#e08a2e" font-weight="600">~2.40 V</text>
  <text x="700" y="254" class="mono ink" font-size="11">open / triggered</text>
  <text x="616" y="284" class="mono dim" font-size="9.5">thresholds: &lt;0.7 · 0.9–1.9 · &gt;2.0</text>

  <text x="24" y="420" class="mono dim" font-size="10">different EOL value? substitute it for R1 and re-measure the three states on the bench — empirical beats calculated</text>
</svg>
