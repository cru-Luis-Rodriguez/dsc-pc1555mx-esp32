<svg viewBox="0 0 880 620" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Full wiring: DSC panel AUX powers an LM2596 buck converter set to 5 volts feeding the ESP32. Yellow clock and green data lines each pass through a 33 kilohm resistor to a junction feeding GPIO 18 and GPIO 19, with 10 kilohm resistors from each junction to ground. Panel Black ties to ESP32 ground. An optional NPN transistor driven from GPIO 21 through 1 kilohm pulls the green data line low for the virtual keypad.">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ink  { fill: #2b2f2e; }
    .dim  { fill: #6d7a76; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b2f2e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="620" rx="8" fill="#f7f6f3" stroke="#d8d5cd"/>
  <text x="24" y="34" class="sans ink" font-size="16" font-weight="700">Keybus → ESP32 — read-only tap, panel-powered</text>

  <!-- ============ PANEL ============ -->
  <rect x="24" y="60" width="128" height="330" rx="4" fill="#eeece7" stroke="#2b2f2e" stroke-width="1.5"/>
  <text x="88" y="82" text-anchor="middle" class="sans ink" font-size="12" font-weight="700">DSC PC1555</text>
  <text x="88" y="96" text-anchor="middle" class="mono dim" font-size="9">terminal strip</text>

  <circle cx="152" cy="130" r="5" fill="#c0392b"/>
  <text x="140" y="134" text-anchor="end" class="mono" font-size="11" font-weight="600" fill="#c0392b">AUX +</text>
  <circle cx="152" cy="170" r="5" fill="#2b2f2e"/>
  <text x="140" y="174" text-anchor="end" class="mono ink" font-size="11" font-weight="600">AUX −</text>
  <circle cx="152" cy="250" r="5" fill="#2b2f2e"/>
  <text x="140" y="254" text-anchor="end" class="mono ink" font-size="11" font-weight="600">BLK</text>
  <circle cx="152" cy="300" r="5" fill="#c9a227"/>
  <text x="140" y="304" text-anchor="end" class="mono" font-size="11" font-weight="600" fill="#a8871e">YEL</text>
  <circle cx="152" cy="360" r="5" fill="#3e8e5a"/>
  <text x="140" y="364" text-anchor="end" class="mono" font-size="11" font-weight="600" fill="#3e8e5a">GRN</text>

  <text x="160" y="316" class="mono dim" font-size="9">clock</text>
  <text x="160" y="376" class="mono dim" font-size="9">data</text>

  <!-- ============ BUCK ============ -->
  <rect x="280" y="98" width="170" height="96" rx="4" fill="#fff" stroke="#2b2f2e" stroke-width="1.5"/>
  <text x="365" y="122" text-anchor="middle" class="sans ink" font-size="13" font-weight="700">LM2596 buck</text>
  <text x="365" y="138" text-anchor="middle" class="mono" font-size="10" fill="#e08a2e" font-weight="600">set OUT to 5.0 V first</text>
  <text x="292" y="160" class="mono dim" font-size="10">IN+</text>
  <text x="292" y="184" class="mono dim" font-size="10">IN−</text>
  <text x="438" y="160" text-anchor="end" class="mono dim" font-size="10">OUT+</text>
  <text x="438" y="184" text-anchor="end" class="mono dim" font-size="10">OUT−</text>

  <!-- AUX+ -> IN+ -->
  <path d="M157,130 H240 V156 H280" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="196" y="122" class="mono" font-size="10" fill="#c0392b">~13.8 V</text>
  <!-- AUX- -> IN- -->
  <path d="M157,170 H250 V180 H280" fill="none" stroke="#2b2f2e" stroke-width="2.5"/>
  <!-- OUT+ -> VIN -->
  <path d="M450,156 H560 V120 H676" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="600" y="112" class="mono" font-size="11" font-weight="600" fill="#c0392b">5.0 V</text>
  <!-- OUT- -> ground bus -->
  <path d="M450,180 H520 V250" fill="none" stroke="#2b2f2e" stroke-width="2.5"/>

  <!-- ============ GROUND BUS ============ -->
  <!-- horizontal bus y=250 from BLK to ESP32 GND -->
  <path d="M157,250 H676" fill="none" stroke="#2b2f2e" stroke-width="2.5"/>
  <circle cx="520" cy="250" r="4.5" fill="#2b2f2e"/>
  <text x="330" y="242" class="mono dim" font-size="10">common ground — the one thing that must be right</text>

  <!-- ============ DIVIDERS ============ -->
  <!-- YELLOW channel y=300 -->
  <path d="M157,300 H210" fill="none" stroke="#c9a227" stroke-width="2.5"/>
  <rect x="210" y="288" width="70" height="24" rx="3" fill="#fff" stroke="#2b2f2e" stroke-width="1.5"/>
  <text x="245" y="304" text-anchor="middle" class="mono ink" font-size="11">33 kΩ</text>
  <path d="M280,300 H360" fill="none" stroke="#2b2f2e" stroke-width="2"/>
  <circle cx="360" cy="300" r="4.5" fill="#2b2f2e"/>
  <path d="M360,300 H676" fill="none" stroke="#2b2f2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="470" y="292" class="mono" font-size="10.5" fill="#3b6ea5" font-weight="600">≈ 2.93 V</text>
  <!-- 10k down from yellow junction, then to bus via y=430 rail -->
  <path d="M360,300 V330" fill="none" stroke="#2b2f2e" stroke-width="2"/>
  <rect x="336" y="330" width="48" height="26" rx="3" fill="#fff" stroke="#2b2f2e" stroke-width="1.5"/>
  <text x="360" y="347" text-anchor="middle" class="mono ink" font-size="10.5">10 kΩ</text>
  <path d="M360,356 V430 H620 V250" fill="none" stroke="#2b2f2e" stroke-width="2"/>
  <circle cx="620" cy="250" r="4.5" fill="#2b2f2e"/>

  <!-- GREEN channel y=390 -->
  <path d="M157,360 H190 V390 H210" fill="none" stroke="#3e8e5a" stroke-width="2.5"/>
  <circle cx="190" cy="375" r="4.5" fill="#3e8e5a"/>
  <rect x="210" y="378" width="70" height="24" rx="3" fill="#fff" stroke="#2b2f2e" stroke-width="1.5"/>
  <text x="245" y="394" text-anchor="middle" class="mono ink" font-size="11">33 kΩ</text>
  <path d="M280,390 H430" fill="none" stroke="#2b2f2e" stroke-width="2"/>
  <circle cx="430" cy="390" r="4.5" fill="#2b2f2e"/>
  <path d="M430,390 H676" fill="none" stroke="#2b2f2e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="490" y="382" class="mono" font-size="10.5" fill="#3b6ea5" font-weight="600">≈ 2.93 V</text>
  <path d="M430,390 V404" fill="none" stroke="#2b2f2e" stroke-width="2"/>
  <rect x="406" y="404" width="48" height="26" rx="3" fill="#fff" stroke="#2b2f2e" stroke-width="1.5"/>
  <text x="430" y="421" text-anchor="middle" class="mono ink" font-size="10.5">10 kΩ</text>
  <path d="M430,430 H620" fill="none" stroke="#2b2f2e" stroke-width="2"/>
  <circle cx="430" cy="430" r="0.1" fill="#2b2f2e"/>
  <circle cx="360" cy="430" r="4.5" fill="#2b2f2e"/>

  <!-- ============ ESP32 ============ -->
  <rect x="676" y="80" width="180" height="380" rx="4" fill="#eeece7" stroke="#2b2f2e" stroke-width="2"/>
  <text x="766" y="262" text-anchor="middle" class="sans ink" font-size="18" font-weight="700">ESP32</text>
  <text x="766" y="280" text-anchor="middle" class="mono dim" font-size="9">ESP32-WROOM-32 only</text>
  <text x="688" y="124" class="mono ink" font-size="12" font-weight="600">5V / VIN</text>
  <text x="688" y="254" class="mono ink" font-size="12" font-weight="600">GND</text>
  <text x="688" y="304" class="mono" font-size="12" font-weight="600" fill="#a8871e">GPIO 18</text>
  <text x="756" y="304" class="mono dim" font-size="9">clock</text>
  <text x="688" y="394" class="mono" font-size="12" font-weight="600" fill="#3e8e5a">GPIO 19</text>
  <text x="756" y="394" class="mono dim" font-size="9">read</text>
  <text x="688" y="444" class="mono" font-size="12" font-weight="600" fill="#3b6ea5">GPIO 21</text>
  <text x="756" y="444" class="mono dim" font-size="9">write</text>

  <!-- ============ OPTIONAL NPN ============ -->
  <rect x="120" y="470" width="440" height="120" rx="6" fill="none" stroke="#6d7a76" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="136" y="492" class="sans" font-size="11" font-weight="600" fill="#6d7a76">optional — virtual keypad (arm/disarm from the browser)</text>

  <!-- GPIO21 wire down into region -->
  <path d="M676,440 H600 V540 H420" fill="none" stroke="#3b6ea5" stroke-width="2"/>
  <!-- 1k -->
  <rect x="350" y="528" width="70" height="24" rx="3" fill="#fff" stroke="#2b2f2e" stroke-width="1.5"/>
  <text x="385" y="544" text-anchor="middle" class="mono ink" font-size="11">1 kΩ</text>
  <path d="M350,540 H300" fill="none" stroke="#2b2f2e" stroke-width="2"/>
  <!-- transistor: circle, base at right (300,540), collector top, emitter bottom -->
  <circle cx="272" cy="540" r="26" fill="#fff" stroke="#2b2f2e" stroke-width="1.5"/>
  <path d="M300,540 H282" fill="none" stroke="#2b2f2e" stroke-width="2"/>
  <path d="M282,528 V552" fill="none" stroke="#2b2f2e" stroke-width="2.5"/>
  <path d="M282,533 L262,518" fill="none" stroke="#2b2f2e" stroke-width="2"/>
  <path d="M282,547 L262,562 M262,562 l8,-2 m-8,2 l2,-8" fill="none" stroke="#2b2f2e" stroke-width="2"/>
  <text x="272" y="583" text-anchor="middle" class="mono dim" font-size="9.5">2N3904</text>
  <!-- collector up to green tap at (190,375) -->
  <path d="M262,518 V500 H190 V380" fill="none" stroke="#3e8e5a" stroke-width="2"/>
  <text x="176" y="470" class="mono dim" font-size="9" transform="rotate(-90 176 470)">collector → data</text>
  <!-- emitter to ground: down then right to bus riser x=620? route to y=430 rail -->
  <path d="M262,562 V572 H620 V430" fill="none" stroke="#2b2f2e" stroke-width="2"/>
  <circle cx="620" cy="430" r="4.5" fill="#2b2f2e"/>

  <text x="24" y="608" class="mono dim" font-size="10">12.6 V × 10 ÷ (33 + 10) ≈ 2.93 V — under the 3.3 V rail, above logic-high · bench alternative: power ESP32 from USB and connect only the grounds</text>
</svg>
