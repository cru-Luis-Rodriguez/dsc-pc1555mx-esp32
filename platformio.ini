; DSC PC1555 (Power632) Keybus interface — ESP32
;
; Three build targets:
;   pio run -e reader -t upload -t monitor   → RAW Keybus dump (diagnostics)
;   pio run -e serial -t upload -t monitor   → serial status stream
;   pio run -e web    -t upload -t monitor   → standalone LAN web page
;
; Start with -e reader on a panel of unknown health. It prints raw decoded
; traffic and does not require the panel to reach a normal operating state,
; so it still tells you something when the panel is misbehaving. The serial
; and web targets decode into zone/arming state and print nothing at all if
; that decoding fails, which is ambiguous when you are still diagnosing.
;
; IMPORTANT: platform is pinned to espressif32 6.x on purpose.
; That series ships arduino-esp32 2.0.x. dscKeybusInterface does NOT compile
; against arduino-esp32 3.x — the timer API changed (timerBegin() signature,
; timerAlarmEnable/Disable removed). See taligentx/dscKeybusInterface#344.
; Do not bump this to espressif32@^7 without patching the library.

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
lib_deps =
    dscKeybusInterface@^3.0.0

[env:reader]
build_src_filter = +<keybus_reader.cpp>

[env:serial]
build_src_filter = +<status_serial.cpp>

[env:web]
build_src_filter = +<web_status.cpp>
